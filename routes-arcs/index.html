<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Routes as curved arcs</title>
<link rel="stylesheet" href="../common/ext.css?v=5">
<script src="../lib/tableau.extensions.1.latest.js?v=5"></script>
</head>
<body>
<div id="content"></div>
<div class="hint" id="hint" hidden></div>
<details class="ctl">
  <summary>Options</summary>
  <div class="body">
    <label>Map <select id="map"><option value="flat">Flat</option><option value="globe">Globe (3D)</option></select></label>
    <label>Style <select id="style"><option value="dark">Dark</option><option value="light">Light</option></select></label>
    <label>Routes shown <select id="top"><option value="0">All</option><option value="10">Top 10</option><option value="25">Top 25</option><option value="50">Top 50</option><option value="100">Top 100</option><option value="250">Top 250</option></select></label>
    <label>Line width <input type="range" id="lw" min="0.3" max="3" step="0.05" value="1"></label>
    <label id="curveL">Curve <input type="range" id="curve" min="0" max="0.5" step="0.02" value="0.22"></label>
    <label class="chk"><input type="checkbox" id="arrows">&nbsp;Arrowheads</label>
    <label class="chk"><input type="checkbox" id="anim">&nbsp;Animate flow</label>
  </div>
</details>
<div class="note" id="note"></div>
<script src="../common/world.js?v=5"></script>
<script src="../common/basemap.js?v=5"></script>
<script src="../common/globe.js?v=5"></script>
<script src="places.js?v=5"></script>
<script src="../common/tx.js?v=5"></script>
<script src="routes-arcs.js?v=5"></script>
</body>
</html>
